<script>
  // GitHub Pages sirve este archivo ante cualquier ruta desconocida.
  // Lo traducimos a la ruta interna del sitio (#/...) sin que el visitante vea el error.
  (function () {
    var p = location.pathname.replace(/^\/+|\/+$/g, '');
    var viejas = {
      'proyectos/casas': 'proyectos',
      'proyectos/cabanas': 'proyectos',
      'proyectos/hoteleria': 'proyectos',
      'proyectos/habitacionales': 'proyectos',
      'proyectos/comerciales': 'proyectos'
    };
    if (viejas[p]) p = viejas[p];
    location.replace('/' + (p ? '#/' + p : '') + location.search);
  })();
</script>
